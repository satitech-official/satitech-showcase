<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sati Lead Engine</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}.w{max-width:1100px;margin:auto;padding:24px}.h,.c{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 24px #0001}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{padding:12px;border-radius:10px;border:1px solid #d8deea}button{background:#111827;color:white;border:0;cursor:pointer}.g{display:grid;gap:12px;margin-top:16px}.m{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:10px;font-size:13px}.b{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px;margin-right:5px}.wa{background:#0b7a36}.connect{margin-top:16px}.ok{color:#087a35;font-weight:700}.bad{color:#b42318;font-weight:700}#qr{width:260px;max-width:100%;display:none;border:12px solid #fff;border-radius:14px;box-shadow:0 4px 18px #0002;margin-top:14px}</style><body><div class=w><div class=h><h1>Sati Technologies — India Lead Engine</h1><p>Free public lead discovery • No-website priority • Unique customized outreach</p><div class=row><input id=city placeholder="City e.g. Indore"><select id=cat><option value=hotel>Hotels</option><option value=resort>Resorts</option><option value=restaurant>Restaurants</option><option value=cafe>Cafes</option><option value=real_estate>Real Estate</option><option value=school>Schools</option><option value=clinic>Clinics</option><option value=hospital>Hospitals</option><option value=gym>Gyms</option><option value=salon>Salons</option></select><button onclick=go()>Find Fresh No-Website Leads</button></div></div><div class="c connect"><h2>WhatsApp Connection</h2><p>Scan once from WhatsApp → Linked Devices. Session will be reused while WAHA storage remains available.</p><div class=row><button class=wa onclick=connectWhatsapp()>Connect WhatsApp</button><button onclick=checkWa()>Refresh Status</button><span id=wastatus>Not checked</span></div><img id=qr alt="WhatsApp QR"></div><p id=s></p><div id=g class=g></div></div><script>const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function go(){s.textContent='Searching…';g.innerHTML='';let r=await fetch('/api/leads?category='+encodeURIComponent(cat.value)+'&city='+encodeURIComponent(city.value)+'&noWebsite=true'),d=await r.json();s.textContent=r.ok?d.count+' qualified leads found':d.error;(d.leads||[]).forEach(x=>{let e=document.createElement('div');e.className='c';e.innerHTML=`<h3>${esc(x.name)}</h3><span class=b>Score ${x.score}</span><span class=b>No website</span><p>${esc(x.phone||x.whatsapp||'No public phone in source')}</p><div class=m>${esc(x.message)}</div>${x.whatsappLink?`<p><a target=_blank href="${x.whatsappLink}"><button class=wa>Open WhatsApp</button></a></p>`:''}`;g.appendChild(e)})}async function connectWhatsapp(){wastatus.textContent='Starting session…';try{await fetch('/api/whatsapp/status',{method:'POST'});qr.src='/api/whatsapp/qr?t='+Date.now();qr.style.display='block';wastatus.textContent='Scan QR with WhatsApp';pollWa()}catch(e){wastatus.textContent=e.message}}async function checkWa(){try{let r=await fetch('/api/whatsapp/status'),d=await r.json();let st=d.status||'UNKNOWN';wastatus.textContent=st;wastatus.className=st==='WORKING'?'ok':'bad';if(st==='WORKING')qr.style.display='none';return st}catch(e){wastatus.textContent='Unavailable';wastatus.className='bad';return''}}function pollWa(){let n=0,t=setInterval(async()=>{let st=await checkWa();n++;if(st==='WORKING'||n>40)clearInterval(t)},3000)}checkWa()</script></body></html>
