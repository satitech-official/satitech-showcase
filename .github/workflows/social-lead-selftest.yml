name: Social Lead Self Test
on:
  push:
    paths:
      - '.github/workflows/social-lead-selftest.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test category-first social lead endpoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://kmlvyemgiubjagksarpt.supabase.co/functions/v1/social-lead-search'
          test_city(){
            c="$1";
            echo "=== $c ==="
            out=$(curl -fsS --retry 1 --max-time 25 --get "$base" --data-urlencode 'platform=all' --data-urlencode "city=$c" --data-urlencode 'limit=100')
            echo "$out" | jq '{ok,city,count,businesses_scanned,counts,source,endpoint,note,error,samples:(.leads[:4]|map({platform,business_name,profile_url,public_contact,website_status,lead_score}))}'
            echo "$out" | jq -e '.ok == true and (.businesses_scanned >= 0)' >/dev/null
          }
          test_city Dubai
          sleep 3
          test_city London
          sleep 3
          test_city 'Indore, India'
