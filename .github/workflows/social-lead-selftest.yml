name: Social Lead Self Test
on:
  push:
    paths:
      - '.github/workflows/social-lead-selftest.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test social lead endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://kmlvyemgiubjagksarpt.supabase.co/functions/v1/social-lead-search'
          test_one(){
            p="$1"; c="$2";
            echo "=== $p | $c ==="
            out=$(curl -sS --retry 1 --max-time 25 --get "$base" --data-urlencode "platform=$p" --data-urlencode "city=$c" --data-urlencode 'limit=5' --data-urlencode 'radius=18000')
            echo "$out" | jq '{ok,platform,city,count,source,endpoint,radius_m,note,error,sample:(.leads[0] // null)}'
            echo "$out" | jq -e '.ok == true' >/dev/null
          }
          test_one instagram Dubai
          test_one facebook Dubai
          test_one linkedin London
          test_one x London
          test_one reddit 'New York'
          test_one whatsapp 'Indore, India'
          test_one email 'Indore, India'
