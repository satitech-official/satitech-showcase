name: Sales OS v0.9.2 Acceptance
on:
  push:
    paths:
      - 'sales-os/index.html'
      - 'sales-os/v092-patch.js'
      - '.github/workflows/sales-os-v092-selftest.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages publish
        run: sleep 25
      - name: Test live dashboard and APIs
        shell: bash
        run: |
          set -euo pipefail
          page='https://satitech-official.github.io/satitech-showcase/sales-os/'
          sync='https://kmlvyemgiubjagksarpt.supabase.co/functions/v1/gateway-sync'
          leads='https://sati-sales-os-live.vercel.app/api/lead-search?city=Indore&category=restaurant'
          echo '[1/7] live dashboard'
          curl -fsSL --max-time 20 "$page" -o /tmp/index.html
          grep -q 'v0.9.2' /tmp/index.html
          grep -q 'v092-patch.js' /tmp/index.html
          echo '[2/7] dashboard JavaScript'
          curl -fsSL --max-time 20 "${page}v09.js?v=092" -o /tmp/base.js
          curl -fsSL --max-time 20 "${page}v092-patch.js?v=1" -o /tmp/patch.js
          node --check /tmp/base.js
          node --check /tmp/patch.js
          echo '[3/7] cloud health'
          curl -fsSL --max-time 20 "$sync/health" | jq -e '.ok == true'
          echo '[4/7] connector heartbeat'
          curl -fsSL --max-time 20 "$sync/connectors" | jq -e '.ok == true and (.connectors|type == "array")'
          echo '[5/7] automation snapshot'
          curl -fsSL --max-time 20 "$sync/snapshot" | jq -e '.ok == true'
          echo '[6/7] live lead discovery'
          curl -fsSL --max-time 20 "$leads" | jq -e '.ok == true and (.leads|type == "array") and (.count >= 1)'
          echo '[7/7] acceptance complete'
          echo 'ACCEPTANCE_OK'
